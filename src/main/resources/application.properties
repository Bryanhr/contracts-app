spring.application.name=contracts-api
server.port=${PORT:8080}

#Conexion inicial con base de datos en local
#spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/contracts_db
#spring.datasource.username=${DB_USER:contracts}
#spring.datasource.password=${DB_PASSWORD:contracts}

#Conexion con base de datos en la nube
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:27011}/db_contracts_api?ssl-mode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:4200

spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}